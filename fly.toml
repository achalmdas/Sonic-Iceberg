# Fly.io config. Deploy with: fly deploy
app = "sonic-iceberg"
primary_region = "lax"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # sleep when idle; wakes on the next request
  auto_start_machines = true
  min_machines_running = 0

# Persistent disk for the shared artist cache and finished icebergs.
[mounts]
  source = "iceberg_data"
  destination = "/app/data"

[[vm]]
  memory = "1gb"                   # DuckDB headroom for large exports
  cpu_kind = "shared"
  cpus = 1
